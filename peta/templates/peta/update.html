<html>
  <!DOCTYPE html>
  <head>
    <title>Update Superhero</title>
    <!-- memanggil bootstrap -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-
MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-
q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-
ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-
ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container" style="margin-top: 200px">
      <h2>Update Superhero</h2>
      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <div class="alert alert-primary" role="alert">{{ message }}</div>
        {% endfor %}
      </ul>
      {% endif %}
      <form method="POST" action="{% url 'simpan_update_superhero' hero.id %}">
        {% csrf_token %}
        <div class="form-group">
          <label>Nama Superhero</label>
          <input
            type="text"
            class="form-control"
            name="nama"
            value="{{ hero.nama }}"
            placeholder="Nama Superhero"
          />
        </div>
        <div class="form-group">
          <label>Latitude</label>
          <input
            type="text"
            class="form-control"
            name="lat"
            value="{{ hero.lat }}"
            placeholder="Latitude"
          />
        </div>
        <div class="form-group">
          <label>Longitude</label>
          <input
            type="text"
            class="form-control"
            name="long"
            value="{{ hero.long }}"
            placeholder="Longitude"
          />
        </div>
        <div class="form-group">
          <label>Asosiasi</label>
          <input
            type="text"
            class="form-control"
            name="asosiasi"
            value="{{ hero.asosiasi }}"
            placeholder="Asosiasi"
          />
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <input
            type="text"
            class="form-control"
            name="deskripsi"
            value="{{ hero.deskripsi }}"
            placeholder="Deskripsi"
          />
        </div>
        <button type="submit" class="btn btn-primary">Update Superhero</button>
      </form>
    </div>
  </body>
</html>
